<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>AI開発チーム</title>
  <!-- 背景（アプリのメインカラー） -->
  <rect width="64" height="64" rx="14" fill="#2f6fed"/>
  <!-- エージェント同士の連携（相談・受け渡し） -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75">
    <line x1="32" y1="18" x2="18" y2="45"/>
    <line x1="32" y1="18" x2="46" y2="45"/>
    <line x1="18" y1="45" x2="46" y2="45"/>
  </g>
  <!-- PM（上）・SE（左下）・PG（右下） -->
  <circle cx="32" cy="18" r="8.5" fill="#ffd166"/>
  <circle cx="18" cy="45" r="8.5" fill="#7ee2a8"/>
  <circle cx="46" cy="45" r="8.5" fill="#ffffff"/>
</svg>
